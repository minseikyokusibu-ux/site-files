<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>読み込み中...</title>
  <style>
    body { font-family: "Helvetica Neue", Arial, sans-serif; background: #f4f6f8; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; color: #333; }
    .box { text-align: center; background: #ffffff; padding: 40px 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); max-width: 80%; }
    .spinner { border: 4px solid #eef2f5; border-top: 4px solid #3498db; border-radius: 50%; width: 44px; height: 44px; animation: spin 0.8s linear infinite; margin: 0 auto 20px; }
    p { font-size: 16px; font-weight: 500; margin: 0; color: #555; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <p>書類を読み込んでいます。<br>しばらくお待ちください...</p>
  </div>
  <script>
    window.onload = function() {
      setTimeout(function() {
        window.location.replace("https://mozilla.github.io/pdf.js/web/viewer.html?file=https%3A%2F%2Fraw.githubusercontent.com%2Fminseikyokusibu-ux%2Fsite-files%2Fmain%2F%25E4%25B8%258A%25E9%2583%25A8%25E5%259B%25A3%25E4%25BD%2593%2F%25E6%25A9%259F%25E9%2596%25A2%25E7%25B4%2599%25E3%2581%2598%25E3%2581%25A1%25E3%2582%258D%25E3%2581%2586%25E5%258F%25B7%25E5%25A4%2596%25EF%25BC%25882026%25E4%25BA%25BA%25E5%258B%25A7%25E7%2589%25B9%25E9%259B%2586%25E5%258F%25B7%25EF%25BC%259A8%25E6%259C%25887%25E6%2597%25A5%25E7%2599%25BA%25E8%25A1%258C%25EF%25BC%2589.pdf");
      }, 800);
    };
  </script>
</body>
</html>
