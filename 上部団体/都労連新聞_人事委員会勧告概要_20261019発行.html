<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>書類を開いています...</title>
  <style>
    html, body { background-color: #ffffff; height: 100%; margin: 0; display: flex; justify-content: center; align-items: center; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .loader-container { text-align: center; }
    .spinner { width: 40px; height: 40px; border: 3px solid #f3f3f3; border-top: 3px solid #3498db; border-radius: 50%; animation: spin 0.6s linear infinite; margin: 0 auto 16px; }
    .text { color: #666; font-size: 14px; letter-spacing: 0.5px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="loader-container">
    <div class="spinner"></div>

  </div>
